<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TatarStrim - Платформа</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #0b0f1a; color: white; }
        .active-border { border: 2px solid #6366f1; box-shadow: 0 0 15px #6366f1; }
        video { width: 100%; border-radius: 12px; background: #000; }
    </style>
</head>
<body class="p-4">
    <div id="auth-screen" class="max-w-md mx-auto mt-20 bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
        <h1 class="text-4xl font-black mb-6 text-center text-indigo-500">TATAR STRIM</h1>
        <input id="username-input" type="text" placeholder="Ваш ник" class="w-full p-3 mb-4 rounded-xl bg-slate-700 border border-slate-600 outline-none text-white">
        <button onclick="registerUser()" class="w-full bg-indigo-600 hover:bg-indigo-700 p-3 rounded-xl font-bold shadow-lg transition-all">Войти</button>
    </div>

    <div id="main-screen" class="hidden">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <h1 class="text-3xl font-black text-indigo-500 italic">TATARSTRIM</h1>
            <div class="flex gap-4">
                <button onclick="askPassword()" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-full font-bold transition">Начать свой стрим</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Левая колонка: Список стримов -->
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                <h2 class="font-bold text-indigo-400 mb-4 uppercase text-sm tracking-widest">Сейчас в эфире</h2>
                <div id="stream-list" class="space-y-3">
                    <p class="text-slate-500 text-sm italic">Активных стримов нет...</p>
                </div>
            </div>

            <!-- Центр: Плеер -->
            <div class="lg:col-span-2 relative">
                <div id="donation-box" class="hidden absolute top-10 left-1/2 -translate-x-1/2 z-50 bg-yellow-400 p-4 rounded-xl text-black font-black text-center shadow-2xl border-4 border-white animate-bounce">
                    <div id="donation-text"></div>
                </div>
                <video id="remote-video" autoplay playsinline controls></video>
                <div class="mt-4 p-4 bg-slate-800 rounded-xl flex justify-between items-center">
                    <div>
                        <h2 id="stream-title" class="text-xl font-bold italic">Выберите стрим из списка слева</h2>
                        <p class="text-slate-400 text-sm">Звук может быть выключен по умолчанию (нажмите на плеер)</p>
                    </div>
                </div>
            </div>

            <!-- Правая колонка: Чат -->
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col h-[500px]">
                <h3 class="font-bold text-center border-b border-slate-800 pb-2 mb-4">ЧАТ</h3>
                <div id="chat" class="flex-grow overflow-y-auto space-y-2 mb-4 text-sm"></div>
                <div class="flex gap-2">
                    <input id="chat-input" type="text" placeholder="Сообщение..." class="w-full bg-slate-800 p-2 rounded-lg outline-none">
                    <button onclick="sendMessage()" class="bg-indigo-600 px-4 rounded-lg font-bold">></button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
