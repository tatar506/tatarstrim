<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TatarStrim - Прямой эфир</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ПОДКЛЮЧАЕМ SOCKET.IO ЧЕРЕЗ CDN (это решит ошибку 404) -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .chat-container { height: 400px; overflow-y: auto; }
        .donation-alert { display: none; position: absolute; top: 20%; left: 50%; transform: translateX(-50%); z-index: 100; }
        video { width: 100%; border-radius: 12px; background: #000; }
    </style>
</head>
<body class="p-4">
    <div id="auth-screen" class="max-w-md mx-auto mt-20 bg-slate-800 p-8 rounded-lg shadow-xl border border-slate-700">
        <h1 class="text-3xl font-bold mb-6 text-center text-indigo-400">TATAR STRIM</h1>
        <input id="username-input" type="text" placeholder="Ваш ник" class="w-full p-2 mb-4 rounded bg-slate-700 border border-slate-600 outline-none text-white">
        <button onclick="registerUser()" class="w-full bg-indigo-600 hover:bg-indigo-700 p-2 rounded font-bold transition">Войти на сайт</button>
    </div>

    <div id="main-screen" class="hidden">
        <header class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <h1 class="text-2xl font-black text-indigo-400 uppercase">TatarStrim</h1>
            <div id="streamer-controls">
                <button id="start-btn" onclick="askPassword()" class="bg-red-600 px-4 py-2 rounded font-bold hover:bg-red-700 transition">Запустить трансляцию</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-3 relative">
                <div id="donation-box" class="donation-alert bg-yellow-400 p-6 rounded-lg shadow-2xl text-center border-4 border-white">
                    <h2 class="text-2xl font-bold text-black">НОВЫЙ ДОНАТ!</h2>
                    <p id="donation-text" class="text-xl text-black font-black italic"></p>
                </div>
                <video id="remote-video" autoplay playsinline controls></video>
                <video id="local-video" autoplay muted class="hidden"></video>
            </div>

            <div class="bg-slate-800 rounded-lg p-4 flex flex-col shadow-xl border border-slate-700">
                <h3 class="font-bold mb-4 border-b border-slate-700 pb-2 text-indigo-300 text-center uppercase tracking-widest">Чат</h3>
                <div id="chat" class="chat-container mb-4 text-sm flex-grow space-y-2"></div>
                <div class="flex gap-2">
                    <input id="chat-input" type="text" placeholder="Сообщение..." class="flex-grow p-2 rounded bg-slate-700 border-none outline-none">
                    <button onclick="sendMessage()" class="bg-indigo-600 px-4 py-2 rounded font-bold hover:bg-indigo-700 transition">></button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
